name: Mobile PWA

on:
  push:
    branches: [main]
    paths:
      - "mobile-pwa/**"
      - "src/lib/markdown.js"
      - "src/lib/responseDedup.js"
      - "scripts/validate-mobile-assets.mjs"
      - "scripts/test-response-dedup.mjs"
      - "package.json"
      - ".github/workflows/mobile-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish mobile web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate mobile assets
        run: npm run check:mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-pwa
      - id: deployment
        uses: actions/deploy-pages@v4
