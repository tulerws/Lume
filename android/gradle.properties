# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# ─── Memória, e por que estes números e não os padrões ───────────────────────
#
# Esta configuração foi ajustada para uma máquina de 15 GiB em que o Android
# Studio sozinho ocupa 3 GB. O gargalo aqui **não é CPU**: é memória, e o padrão
# do Gradle piora o quadro em vez de melhorar.
#
# `org.gradle.workers.max` tem como padrão o número de processadores — 12 nesta
# máquina. Doze trabalhadores concorrentes, cada um segurando memória, com menos
# de 4 GiB disponíveis, empurram tudo para o zram. E o zram **comprime páginas
# usando CPU**: a máquina passa a gastar processador para não usar memória, e o
# sintoma é congelamento, não lentidão. Limitar a 4 troca alguns segundos de
# build por uma máquina que continua respondendo.
#
# O daemon sobe de 2 GB para 3 GB pelo motivo oposto: com heap apertado o GC
# roda sem parar e come CPU sem liberar nada de útil. `UseParallelGC` é o que a
# documentação do Android recomenda para o daemon — menos sobrecarga de memória
# que o G1, que é o padrão do JDK moderno.
#
# `kotlin.daemon.jvmargs` existe porque o daemon do Kotlin é um processo
# **separado**, que não herda o limite acima. Sem esta linha ele adota o próprio
# padrão e vira um segundo consumidor de vários GB, invisível em `org.gradle.jvmargs`.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Execução paralela de projetos não ajuda: este build tem um módulo só. Ligá-la
# custaria memória sem nada em troca.
org.gradle.parallel=false

# Cache de build entre execuções. Troca disco por CPU, que é a troca certa aqui.
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# O KSP registra as fontes que gera (build/generated/ksp/…) pelo DSL
# `kotlin.sourceSets`, e o Kotlin embutido do AGP 9 proíbe isso, falhando a
# configuração do projeto com "Using kotlin.sourceSets DSL to add Kotlin sources
# is not allowed with built-in Kotlin".
#
# Esta linha é a supressão que o próprio AGP indica na mensagem de erro, e é a
# alternativa menos invasiva das três: aplicar `org.jetbrains.kotlin.android`
# trocaria o modelo de compilação inteiro do scaffold por causa de uma
# dependência, e abrir mão do KSP significaria abrir mão do Hilt.
#
# É um sinalizador de transição. Quando o KSP passar a usar `android.sourceSets`,
# ou quando o AGP remover o sinalizador, esta linha some — e o sintoma será
# falha de configuração, não comportamento errado em silêncio.
android.disallowKotlinSourceSets=false